env:
  # Required by Next.

jobs:
  check:
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    branches: [main]

# Cancel superseded runs on the same ref so each push only bills one run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege permissions; individual jobs add what they need.
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write  # for posting VRT diff comments

env:
  # Required by Next.js env validation in src/env.ts at build time.
  # These are safe dummy values — nothing is deployed from CI.
  NEXT_PUBLIC_API_URL: http://localhost:8081
  NEXT_PUBLIC_STELLAR_NETWORK: testnet
  NEXT_PUBLIC_STELLAR_TESTNET_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4

# ─────────────────────────────────────────────────────────────────────────────
# LINT
# Runs next lint. Treats any warning as an error (--max-warnings 0).
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
        # The composite action does: checkout → setup-node (from .nvmrc) → npm ci

      - name: Lint
        run: npm run lint:ci

      # Fails if a flag's production default changes without its rollout config.
      - name: Flag rollout guard
        run: node scripts/check-flag-rollout.mjs

  # ───────────────────────────────────────────────────────────────────────────
  # TYPECHECK
  # Runs tsc --noEmit against the project's tsconfig.json.
  # ───────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup

      - name: Typecheck
        run: npm run typecheck

  # ───────────────────────────────────────────────────────────────────────────
  # UNIT TESTS
  # Runs Jest with coverage; uploads the report so it's visible in the
  # GitHub Actions summary and can be picked up by third-party coverage
  # reporters (Codecov, Coveralls, etc.) if added later.
  # ───────────────────────────────────────────────────────────────────────────
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup

      - name: Run unit tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # BUILD
  # Runs `next build`. The .next/cache is restored between runs so
  # incremental builds are fast. The build artifact is uploaded so the
  # bundle workflow can analyse it without re-building.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup

      # Restore the Next.js incremental build cache. Key includes a hash of
      # package-lock.json so the cache is invalidated when deps change.
      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        run: npm run build

      # Upload the production build so the bundle job can measure it without
      # running next build a second time.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.sha }}
          path: |
            .next/
            !.next/cache
          retention-days: 1

  e2e:
    name: Playwright (desktop, iPhone 13, Pixel 7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npx playwright install --with-deps chromium webkit
      # RECORD=1 keeps a video of every test; they're uploaded bel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npx playwright install --with-deps chromium webkit
      # RECORD=1 keeps a video of every test; they're uploaded below as the
      # PR's recordings of the tour, the mode switch and the phone trade flow.
      - run: npx playwright test
        env:
          CI: "true"
          RECORD: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  lighthouse:
    name: Lighthouse (mobile perf ≥ 0.85, CLS < 0.05)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --yes @lhci/cli@0.14.0 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lhci-report
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────────
  # Storybook: Build, test, visual regression, and publish
  # ────────────────────────────────────────────────────────────────────────────
  storybook-build:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run storybook:build
        env:
          # Storybook needs a dummy env so Next.js env validation passes
          NEXT_PUBLIC_API_URL: http://localhost:8081
          NEXT_PUBLIC_NETWORK_LABEL: Testnet
          NEXT_PUBLIC_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'
          NEXT_PUBLIC_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4

      - name: Upload Storybook build artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 7

  storybook-test-runner:
    name: Test Runner (interactions + a11y)
    runs-on: ubuntu-latest
    needs: storybook-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Storybook build
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Storybook test runner
        run: npm run storybook:test
        env:
          # Point the test runner at the static build served by the built-in
          # reference server that test-runner starts automatically.
          TARGET_URL: http://localhost:6006
          # Fail CI on any a11y violation
          SB_TESTRUNNER_SKIP_STORIES_FILE: ''

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-test-results
          path: |
            test-results/
          retention-days: 7

  storybook-visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    needs: storybook-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Download Storybook build
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/

      - name: Serve Storybook static build
        run: |
          npx serve storybook-static --listen 6006 &
          # Wait for the server to be ready
          npx wait-on http://localhost:6006 --timeout 30000
        env:
          CI: true

      - name: Run VRT screenshots
        run: npm run test:vrt
        env:
          CI: true
          STORYBOOK_URL: http://localhost:6006

      - name: Upload VRT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-report-${{ github.run_id }}
          path: |
            playwright-report/storybook-vrt/
            test-results/
          retention-days: 30

      - name: Comment VRT diff on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 📸 Visual Regression Differences Detected\n\nScreenshot diffs were found. Download the **[VRT report artifact](${artifactUrl})** to review pixel-level differences.\n\nTo update baselines:\n\`\`\`bash\nnpx playwright test --config playwright.storybook.config.ts --update-snapshots\ngit add e2e/storybook/__snapshots__\ngit commit -m "chore: update VRT snapshots"\n\`\`\``,
            });

  storybook-publish:
    name: Publish Storybook to GitHub Pages
    runs-on: ubuntu-latest
    needs: [storybook-test-runner, storybook-visual-regression]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download Storybook build
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

