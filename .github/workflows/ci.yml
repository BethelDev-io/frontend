name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so each push only bills one run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege permissions; individual jobs add what they need.
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write  # for posting VRT diff comments

env:
  # Required by Next.js env validation in src/env.ts at build time.
  # These are safe dummy values — nothing is deployed from CI.
  NEXT_PUBLIC_API_URL: http://localhost:8081
  NEXT_PUBLIC_STELLAR_NETWORK: testnet
  NEXT_PUBLIC_STELLAR_TESTNET_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4

# ─────────────────────────────────────────────────────────────────────────────
# LINT
# Runs next lint. Treats any warning as an error (--max-warnings 0).
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
        # The composite action does: checkout → setup-node (from .nvmrc) → npm ci

      - name: Lint
        run: npm run lint:ci

  # ───────────────────────────────────────────────────────────────────────────
  # TYPECHECK
  # Runs tsc --noEmit against the project's tsconfig.json.
  # ───────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup

      - name: Typecheck
        run: npm run typecheck

  # ───────────────────────────────────────────────────────────────────────────
  # UNIT TESTS
  # Runs Jest with coverage; uploads the report so it's visible in the
  # GitHub Actions summary and can be picked up by third-party coverage
  # reporters (Codecov, Coveralls, etc.) if added later.
  # ───────────────────────────────────────────────────────────────────────────
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup

      - name: Run unit tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # MIGRATIONS
  # Applies every vault migration to a clean Postgres schema, asserts the
  # resulting schema matches the committed model, and verifies each migration
  # is reversible (up → down → up) and backwards compatible with the previous
  # deployed version. Runs as a separate deploy step, never on app boot.
  # ───────────────────────────────────────────────────────────────────────────
  migrations:
    name: Migrations (up/down/status + schema drift)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: vault_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault -d vault_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://vault:vault@localhost:5432/vault_ci
    steps:
      - uses: ./.github/actions/setup

      - name: Apply all migrations to a clean schema
        run: npm run migrate:up

      - name: Assert schema matches committed model
        run: npm run migrate:check

      - name: Verify migrations are reversible (up → down → up)
        run: npm run migrate:test

      - name: Check backwards compatibility with previous deployed version
        run: npm run migrate:compat

      - name: Report migration status
        if: always()
        run: npm run migrate:status

  # ───────────────────────────────────────────────────────────────────────────
  # BUILD
  # Runs `next build`. The .next/cache is restored between runs so
  # incremental builds are fast. The build artifact is uploaded so the
  # bundle workflow can analyse it without re-building.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup

      # Restore the Next.js incremental build cache. Key includes a hash of
      # package-lock.json so the cache is invalidated when deps change.
      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        run: npm run build

      # Upload the production build so the bundle job can measure it without
      # running next build a second time.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.sha }}
          path: |
            .next/
            !.next/cache
          retention-days: 1

  e2e:
    name: Playwright (desktop, iPhone 13, Pixel 7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npx playwright install --with-deps chromium webkit
      # RECORD=1 keeps a video of every test; they're uploaded below as the
      # PR's recordings of the tour, the mode switch and the phone trade flow.
      - run: npx playwright test
        env:
          CI: "true"
          RECORD: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  lighthouse:
    name: Lighthouse (mobile perf ≥ 0.85, CLS < 0.05)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --yes @lhci/cli@0.14.0 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lhci-report
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────────
  # Storybook: Build, test, visual regression, and publish
  # ────────────────────────────────────────────────────────────────────────────
  storybook-build:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run storybook:build
        env:
          # Storybook needs a dummy env so Next.js env validation passes
          NEXT_PUBLIC_API_URL: http://localhost:8081
          NEXT_PUBLIC_NETWORK_LABEL: Testnet
          NEXT_PUBLIC_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'
          NEXT_PUBLIC_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4

      - name: Upload Storybook build artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 7

  storybook-test-runner:
    name: Test Runner (interactions + a11y)
    runs-on: ubuntu-latest
    needs: storybook-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Storybook build
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Storybook test runner
        run: npm run storybook:test
        env:
          # Point the test runner at the static build served by the built-in
          # reference server.
          TARGET_URL: http://127.0.0.1:6006
